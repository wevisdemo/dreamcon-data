[project]
name = "dreamcon_data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "transformers>=5.17.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
toc_extractor = { path = "openbudget-toc-extractor", editable = true }
thai_budget_extractor = { path = "openbudget-budget-extractor", editable = true }

[tool.setuptools.packages.find]
exclude = ["output*", "script*"]
