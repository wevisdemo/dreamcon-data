name: Update published data

on:
  workflow_dispatch:

concurrency: published-data

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run script
        run: |
          uv sync
          uv run python main.py

      - name: Commit to published-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"

          if git fetch origin published-data; then
            git worktree add publish FETCH_HEAD
            git -C publish checkout -B published-data
          else
            git worktree add --orphan -b published-data publish
          fi

          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r output/. publish/

          cd publish
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: update published data"
          git push origin published-data